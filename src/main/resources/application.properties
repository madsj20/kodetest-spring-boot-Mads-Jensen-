spring.application.name=bank-account-api

# H2 keeps the project runnable without installing a database.
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Recreate the in-memory schema for each application lifecycle.
spring.jpa.hibernate.ddl-auto=create-drop
# Controllers receive DTOs rather than relying on an open persistence session.
spring.jpa.open-in-view=false

# The database console is unnecessary for normal API use and stays disabled by default.
spring.h2.console.enabled=false

# Public exchange-rate API. No API key is needed.
exchange-rate.base-url=https://api.frankfurter.dev
